@for (group of renderGroups; track $index) {
  @if (group.navGroup) {
    <nav class="nav-bar" role="navigation">
      @for (block of group.blocks; track block.id) {
        <ng-container
          [ngComponentOutlet]="resolveComponent(block.__component)"
          [ngComponentOutletInputs]="{ data: block }">
        </ng-container>
      }
    </nav>
  } @else {
    @for (block of group.blocks; track block.id) {
      <ng-container
        [ngComponentOutlet]="resolveComponent(block.__component)"
        [ngComponentOutletInputs]="{ data: block }">
      </ng-container>
    }
  }
}
