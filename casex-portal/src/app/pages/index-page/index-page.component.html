@if (page) {
  @for (zone of pageZones; track zone.name; let isFirst = $first) {
    @if (isFirst) {
      <section class="page-zone" [attr.data-zone]="zone.name">
        <app-dynamic-zone [blocks]="zone.blocks" />
      </section>
    } @else {
      @defer (on viewport) {
        <section class="page-zone" [attr.data-zone]="zone.name">
          <app-dynamic-zone [blocks]="zone.blocks" />
        </section>
      } @placeholder {
        <div class="zone-placeholder" [attr.data-zone]="zone.name"></div>
      }
    }
  }
} @else if (error) {
  <div class="error">
    <span>&#9888;</span>
    <span>{{ error }}</span>
  </div>
} @else {
  <div class="loading">
    <div class="spinner"></div>
    <span>Loading content&hellip;</span>
  </div>
}
