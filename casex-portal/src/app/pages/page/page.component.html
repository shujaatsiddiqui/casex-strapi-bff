@if (page) {
  @for (zone of pageZones; track zone.name) {
    <section class="page-zone" [attr.data-zone]="zone.name">
      <app-dynamic-zone [blocks]="zone.blocks" />
    </section>
  }
} @else if (error) {
  <div class="error">
    <span>&#9888;</span>
    <span>{{ error }}</span>
  </div>
} @else {
  <div class="loading">
    <div class="spinner"></div>
    <span>Loading content&hellip;</span>
  </div>
}
