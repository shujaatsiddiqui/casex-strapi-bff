@if (page) {
  <header class="page-header">
    <app-dynamic-zone [blocks]="page.dz_header ?? []" />
  </header>

  <main class="page-body">
    <app-dynamic-zone [blocks]="page.dz_body ?? []" />
  </main>

  <footer class="page-footer">
    <app-dynamic-zone [blocks]="page.dz_footer ?? []" />
  </footer>
} @else if (error) {
  <div class="error">
    <span>&#9888;</span>
    <span>{{ error }}</span>
  </div>
} @else {
  <div class="loading">
    <div class="spinner"></div>
    <span>Loading content&hellip;</span>
  </div>
}
